*{box-sizing:border-box}
:root{
  --paper:#fafafa;--rule:#ececec;
  --zh:"STXinwei","华文新魏","STXingkai","华文行楷","STKaiti","KaiTi","Songti SC",serif;
  --lat:"Cormorant Garamond","EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  --hand:"Pinyon Script","Monotype Corsiva","Freestyle Script",cursive;
}
html,body{margin:0;padding:0}
/* 滚动条藏掉，滚动保留 */
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}
body{background:#e6e6e6;color:#3f3f3f;-webkit-font-smoothing:antialiased}
.page{max-width:900px;margin:0 auto;background:var(--paper);
  box-shadow:0 34px 80px -56px rgba(0,0,0,.5);
  min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
@media(max-width:939px){.page{box-shadow:none}}

/* ── 卷首（与单日页同款式，居中）── */
.titlewrap{margin:clamp(26px,4.6vw,52px) var(--pad,24px) 0;text-align:center}
.titlewrap h1{margin:0;font-weight:400;font-family:var(--hand);
  font-size:clamp(36px,8vw,64px);line-height:1;color:#191919}
.arch{margin:clamp(10px,1.7vw,16px) 24px 0;display:flex;justify-content:center;align-items:center;
  gap:clamp(13px,2.2vw,20px);color:#a4a4a4;font-weight:400;font-family:var(--zh);
  font-size:clamp(11px,1.6vw,12.5px);letter-spacing:.3em;text-indent:.3em}
.arch i{flex:0 0 auto;width:clamp(34px,8.4vw,88px);height:1px;background:#e3e3e3}
.monthline{margin:clamp(8px,1.4vw,12px) 0 0;text-align:center;
  font-family:var(--lat);font-size:clamp(11px,1.5vw,12.5px);color:#a5a5a5;letter-spacing:.14em}
.monthline b{font-weight:400;color:#8e8e8e}
.monthline .sep{color:#d4d4d4;margin:0 .5em}
/* ── 月份切换：统计行的「YYYY.MM」可点，向下展开纸色年月浮层 ──
   左列 = 年份竖排滚动选择，右格 = 当年 12 月滚动列表；
   有记忆的月份/年份可点，无记忆置灰；当前月/年高亮。 */
.mwrap{position:relative;width:fit-content;margin:0 auto}
.mtrig{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;
  cursor:pointer;border-bottom:1px dashed #d8d8d8;transition:color .2s ease}
.mtrig:hover{color:#6e6e6e}
.mtrig .cv{display:inline-block;width:0;height:0;margin-left:5px;vertical-align:middle;
  border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4.5px solid #bdbdbd;
  transition:transform .22s ease}
.mtrig.on .cv{transform:rotate(180deg)}
.mpick{position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%) translateY(-5px);
  width:max-content;min-width:min(88vw,430px);background:var(--paper);border:1px solid #e7e7e7;
  box-shadow:0 20px 48px -24px rgba(0,0,0,.38);padding:0;z-index:60;
  display:flex;align-items:stretch;
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease}
.mpick.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.yrs{flex:0 0 78px;max-height:262px;overflow-y:auto;border-right:1px solid #eee;padding:8px 0;
  scrollbar-width:none;-ms-overflow-style:none}
.mgrid{flex:1;max-height:262px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;
  gap:5px;padding:10px;align-content:start;scrollbar-width:none;-ms-overflow-style:none}
.yrs::-webkit-scrollbar,.mgrid::-webkit-scrollbar{width:0;height:0;display:none}
.yi{display:block;width:100%;padding:10px 0;background:none;border:0;cursor:pointer;
  font-family:var(--lat);font-size:13.5px;letter-spacing:.08em;color:#5a5a5a;transition:background .15s ease}
.yi.ok:hover{background:#f4f4f4}
.yi.no{opacity:.38;cursor:default}
.yi.cur{background:#f6f6f6;color:#141414}
.mi{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:8px 11px;text-decoration:none;border:1px solid transparent}
.mi .mzh{font-family:var(--zh);font-size:15px;color:#2a2a2a;letter-spacing:.12em;white-space:nowrap}
.mi .men{font-family:var(--lat);font-size:9px;letter-spacing:.12em;color:#8e8e8e;text-align:right;white-space:nowrap}
.mi .men b{display:block;font-weight:400;font-size:8.5px;color:#b4b4b4;margin-top:1px}
.mi.ok:hover{border-color:#e0e0e0;background:#f4f4f4}
.mi.no{opacity:.4;pointer-events:none}
.mi.cur{border-color:#dcdcdc;background:#f6f6f6;pointer-events:none}
.mi.cur .mzh{color:#141414}

/* ── 树台：树图整幅等比缩放；v3 纵向大幅拉长（拉到这么长，空间就大了）
      ~35%（1138/1620）；挂点按 % 线性映射依旧成立 ── */
.stage{position:relative;width:min(92%,760px);margin:clamp(6px,1.5vw,14px) auto clamp(10px,2vw,22px);
  --k:.668} /* --k = 树台宽 / 树图原宽(1138)，JS resize 时更新，牌子/绳子/字号全随它缩放 */
.stage img.tree{display:block;width:100%;aspect-ratio:1138/1620;object-fit:fill}
/* 树本身带质感（v2 素材：原灰度纹理 + 边缘灰渐变 + 根部渐隐），页面不再压灰罩 */
/* 挂牌：细线拴在枝上（4.jpg 款式）。
   牌底：ditu3.jpg 作为**一整幅**铺满树台，每块牌子只是这同一幅图上
   不同的「窗口」（对位由内联 JS 在 load/resize 时计算）。
   牌形不规则：3:2 / 2:3 / 1:1 / 4:3 / 3:4 轮转；框互不交叠。
   日期英文不放框上，放框旁正黑（side-r 右侧 / side-l 左侧，靠边的牌自动换边）。
   微风摆动：.sway 绕挂点小幅摇，每块幅度/周期/相位都不同（--amp/--dur/--del）。 */
/* ── 进场动画：树先浮现 0.55s，挂牌自上而下逐块挂上 ──
   hangIn：钟摆式落位，角度全走 CSS 变量（--h0 起始 → --h1 甩头 → --h2 回摆
   → --h3 微颤 → 静止），每牌方向/幅度/时长（--hdur）由生成器独立生成——
   没有两块牌弧线相同。easing 分段 ease-in-out（极值慢、中段快）。
   落定后无缝接 .sway 的微风摆动。--hi 每块独立延迟（hangOrder 顺序）。 */
.tag{position:absolute;transform:translateX(-50%);transform-origin:50% 0;text-decoration:none;display:block;color:#161616;
  opacity:0;animation:hangIn var(--hdur,.92s) ease-out var(--hi,0s) both}
@keyframes hangIn{
  0%{opacity:0;transform:translateX(-50%) translateY(-14px) rotate(var(--h0,-9deg));animation-timing-function:ease-in}
  34%{opacity:1;transform:translateX(-50%) translateY(0) rotate(var(--h1,7deg));animation-timing-function:ease-in-out}
  62%{transform:translateX(-50%) rotate(var(--h2,-3.5deg));animation-timing-function:ease-in-out}
  84%{transform:translateX(-50%) rotate(var(--h3,1.6deg));animation-timing-function:ease-in-out}
  100%{opacity:1;transform:translateX(-50%) rotate(0deg)}
}
.tree{animation:treeIn .55s ease both}
@keyframes treeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .tag{animation:none;opacity:1}
  .tree{animation:none}
  .tag .sway{animation:none}
}
/* 微风摆动：.sway 绕挂点小幅摇，每块幅度/周期/相位都不同（--amp/--dur/--del）。 */
.tag .sway{display:block;transform-origin:50% 0;
  animation:windsway var(--dur,5s) ease-in-out var(--del,0s) infinite}
@keyframes windsway{
  0%,100%{transform:rotate(calc(var(--amp,1.4deg) * -1))}
  50%{transform:rotate(var(--amp,1.4deg))}
}
@media (prefers-reduced-motion:reduce){.tag .sway{animation:none}}

.tag .txt{position:absolute;white-space:nowrap;
  top:calc(var(--rope,20) * var(--k) * 1px + var(--ch,60) * var(--k) * 0.5px);
  transform:translateY(-50%);font-family:var(--lat)}
.tag .txt.side-r{left:calc(50% + var(--cw,60) * var(--k) * 0.5px + 8px)}
.tag .txt.side-l{right:calc(50% + var(--cw,60) * var(--k) * 0.5px + 8px)}
/* 侧旁文字：黑色系（16:03 定稿：字体回归黑色系）。
   文字位置由 snap-anchors.py 保证全落在白色空地、不碰树、互不重叠 */
.tag .txt b{font-weight:600;font-style:italic;font-size:clamp(14px,2.6vw,19px);line-height:1;color:#1c1c1c}
.tag .txt em{font-style:normal;font-weight:400;font-size:clamp(8.5px,1.4vw,10.5px);letter-spacing:.14em;color:#585858}
.tag:hover .card{border-color:#b9b9b9}
.tag:focus{outline:none}

/* ── 点击进 day 的过渡（定稿：快）──
   点牌：日期与挂绳淡出 0.2s → 纸色白框放大铺满全屏 0.2s → 0.35s 跳单日页；
   单日页各部分依次浮现 ≈0.95s 走完 —— 全程 ≈1.3s < 1.5s。
   白框铺满与单日页纸色无缝。 */
.tag.opening .txt,.tag.opening .ln{opacity:0;transition:opacity .2s ease}
.tag .txt,.tag .ln{transition:opacity .2s ease}
/* flycard 无边框（放大过程灰边丑）——纯纸色块，放大中不出现任何线 */
.flycard{position:fixed;z-index:99;pointer-events:none;overflow:hidden;
  background:var(--paper);transform-origin:0 0;will-change:transform}
@media (prefers-reduced-motion:reduce){.flycard{display:none}}

/* 落款 */
.signoff{padding:clamp(12px,2vw,20px) 24px clamp(26px,4vw,42px);text-align:center;
  font-family:var(--zh);font-size:clamp(11px,1.5vw,12.5px);color:#b0b0b0;letter-spacing:.22em}

/* ── 右上角封存树入口（21:03 定稿：SVG 手绘小树 · 枝上挂两块小牌）──
   线条灰、悬停转墨，与左上返回键同位对称的语言；粗细 1.3 跟 ‹ 的 1.4 一致 */
.sealentry{position:fixed;top:clamp(10px,1.8vw,18px);right:clamp(12px,2vw,22px);z-index:40;
  background:none;border:0;cursor:pointer;padding:9px 11px;color:#8f8f8f;transition:color .15s}
.sealentry:hover{color:#141414}
.sealentry svg{display:block}

/* Mirror House: full-scene mobile layout with a light frosted-glass finish. */
.page{min-height:0;background:rgba(249,252,254,.58);-webkit-backdrop-filter:blur(12px) saturate(125%);backdrop-filter:blur(12px) saturate(125%);box-shadow:0 24px 70px -50px rgba(42,83,103,.28)}
body{background:transparent}
.stage{width:min(92%,760px)}
.tag .card{background:rgba(246,251,254,.58);background-image:none;border:1px solid rgba(130,169,188,.52);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);box-shadow:0 5px 14px -10px rgba(38,78,98,.42)}
.tag .txt b{font-size:clamp(9px,2.6vw,19px)}
.tag .txt em{font-size:clamp(7px,1.4vw,10.5px)}
@media(max-width:520px){
  html,body{width:100%;overflow-x:hidden}
  .page{width:100%;max-width:100%;min-height:0;overflow-x:hidden}
  .stage{width:92%;max-width:760px}
}

/* 镜花水月：轻透收藏挂签，浅色如珍珠纸片，夜间如银灰暗片。 */
.tag .card {
  background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(248,249,251,.54)) !important;
  border:1px solid rgba(255,255,255,.88) !important;
  box-shadow:0 7px 20px -13px rgba(35,43,54,.30),inset 0 1px 0 rgba(255,255,255,.88) !important;
  -webkit-backdrop-filter:blur(10px) saturate(120%) !important;
  backdrop-filter:blur(10px) saturate(120%) !important;
}
[data-theme="night"] .tag .card {
  background:linear-gradient(145deg,rgba(35,35,40,.88),rgba(20,20,24,.78)) !important;
  border-color:rgba(215,216,222,.20) !important;
  box-shadow:0 8px 24px -14px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.07) !important;
}
