<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080b" />
    <meta name="description" content="一个状态驱动、空间化、边界可见的共同空间。" />
    <title>共同空间</title>
    <script>
      // GitHub Pages 的 404.html 会把原始路径存在这里，回到 index 后还原。
      // 必须早于 React Router 初始化。
      (function () {
        try {
          var p = sessionStorage.getItem("spa:redirect");
          if (p) {
            sessionStorage.removeItem("spa:redirect");
            history.replaceState(null, "", p);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c9a87c' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23c9a87c' fill-opacity='.55'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
