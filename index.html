<!doctype html>
<html lang="zh-CN" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2937" />
    <meta name="description" content="镜花水月，一个与 AI 伴侣共同生活、记录回忆与收藏日常的私密空间。" />
    <title>镜花水月 · 与你共度日常</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      // 主题必须在首帧之前定好，否则会闪一下白。
      (function () {
        try {
          var raw = localStorage.getItem("co-space::theme");
          var t = raw ? JSON.parse(raw).state.theme : "night";
          document.documentElement.dataset.theme = t || "night";
        } catch (e) {
          document.documentElement.dataset.theme = "night";
        }
      })();
      // GitHub Pages 的 404.html 会把原始路径存在这里，回到 index 后还原。
      (function () {
        try {
          var p = sessionStorage.getItem("spa:redirect");
          if (p) {
            sessionStorage.removeItem("spa:redirect");
            history.replaceState(null, "", p);
          }
        } catch (e) {}
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e6c69a' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e6c69a' fill-opacity='.55'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
